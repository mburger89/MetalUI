# SDL GPU backend: record fixtures on macOS with the production Metal
# renderer (Experiments/SDLGPU's Replay; frame 4's text made by
# MetalUIPortableText, ruling PT-G), then build Backends/SDL on Linux (no
# Apple frameworks) — its tests include the SDLWindowRenderer's (ruling RS-D)
# — and replay the fixtures on Mesa llvmpipe (CPU Vulkan), and on Windows
# through SDL's Direct3D 12 backend (WARP on GPU-less runners). MetalUISDL
# links AccessKit (ruling AX-A): baked into the Linux image, fetched on Windows.
# The backend's library targets are the root package's, behind its SDL and
# AccessKit traits (ruling PX-H); no pkg-config anywhere (PX-I). The Linux job
# also builds a package generated by `metalui new --cross-platform` against a
# file:// copy of this checkout (tests 1.7 and 1.8, ruling PX-L item 3).

name: SDL GPU Linux + Windows

on:
  push:
    paths:
      - "Experiments/SDLGPU/**"
      - "Examples/Jotter/**"
      - "Backends/SDL/**"
      - "Sources/MetalUIPlatform/**"
      - ".github/workflows/sdl-gpu-linux.yml"
      # The root manifest declares the backend (PX-H) and the scaffold the
      # consumer tests generate (PX-J).
      - "Package.swift"
      - "Sources/CStbImage/**"
      - "Sources/MetalUIScaffold/**"
      - "Tests/MetalUIScaffoldTests/**"
      # Frame 4's text is built by these (rulings PT-G, LB-J).
      - "Sources/MetalUIPortableText/**"
      - "Sources/MetalUIHarfBuzz/**"
      - "Sources/MetalUIFreeType/**"
      - "Sources/CHarfBuzz/**"
      - "Sources/CFreeType/**"
      - "Sources/CUnibreak/**"
      - "Sources/MetalUIScene/**"
      # Frame 5 is the demo's whole tree (ruling DC-B).
      - "Sources/MetalUI/**"
      - "Sources/MetalUIDemoContent/**"
      - "Sources/MetalUILayout/**"
      - "Sources/MetalUICore/**"
      - "Sources/MetalUITextSystem/**"
      - "Sources/MetalUIPrimitives/**"
      # Every frame's reference is drawn by the Metal renderer; frame 6 is its
      # ellipse kind and image primitive (rulings TE-AE, TE-AF).
      - "Sources/MetalUIRender/**"
      # Frames 9-11 are the backdrop blur (ruling BB-J): its record, its CPU
      # reference and the level count both renderers share.
      - "Sources/MetalUIShaderTypes/**"
      - "Sources/MetalUIPath/**"
      - "Tests/Fonts/**"
  pull_request:
    paths:
      - "Experiments/SDLGPU/**"
      - "Examples/Jotter/**"
      - "Backends/SDL/**"
      - "Sources/MetalUIPlatform/**"
      - ".github/workflows/sdl-gpu-linux.yml"
      # The root manifest declares the backend (PX-H) and the scaffold the
      # consumer tests generate (PX-J).
      - "Package.swift"
      - "Sources/CStbImage/**"
      - "Sources/MetalUIScaffold/**"
      - "Tests/MetalUIScaffoldTests/**"
      # Frame 4's text is built by these (rulings PT-G, LB-J).
      - "Sources/MetalUIPortableText/**"
      - "Sources/MetalUIHarfBuzz/**"
      - "Sources/MetalUIFreeType/**"
      - "Sources/CHarfBuzz/**"
      - "Sources/CFreeType/**"
      - "Sources/CUnibreak/**"
      - "Sources/MetalUIScene/**"
      # Frame 5 is the demo's whole tree (ruling DC-B).
      - "Sources/MetalUI/**"
      - "Sources/MetalUIDemoContent/**"
      - "Sources/MetalUILayout/**"
      - "Sources/MetalUICore/**"
      - "Sources/MetalUITextSystem/**"
      - "Sources/MetalUIPrimitives/**"
      # Every frame's reference is drawn by the Metal renderer; frame 6 is its
      # ellipse kind and image primitive (rulings TE-AE, TE-AF).
      - "Sources/MetalUIRender/**"
      # Frames 9-11 are the backdrop blur (ruling BB-J): its record, its CPU
      # reference and the level count both renderers share.
      - "Sources/MetalUIShaderTypes/**"
      - "Sources/MetalUIPath/**"
      - "Tests/Fonts/**"
  workflow_dispatch:

jobs:
  record:
    name: Record fixtures (macOS, Metal)
    runs-on: xcode-27  # Swift 6.4 (Xcode 27, preview image)
    defaults:
      run:
        working-directory: Experiments/SDLGPU
    steps:
      - uses: actions/checkout@v7
      - name: Install SDL3
        run: brew install sdl3
      - name: Compiled shaders match replay.hlsl
        working-directory: Backends/SDL/Shaders
        run: shasum -a 256 -c compiled/SOURCE.sha256
      - name: Record, and check SDL Metal parity live
        # --portable: the HLSL -> SPIR-V -> MSL stages, the same source Linux runs.
        # Homebrew's SDL3 is off the compiler's default paths (PX-I item 3);
        # Replay does not build MetalUISDL, so it needs no AccessKit.
        run: |
          B=$(brew --prefix)
          swift run -Xcc -I$B/include -Xlinker -L$B/lib Replay --portable --record "$PWD/fixtures"
      - uses: actions/upload-artifact@v7
        with:
          name: fixtures
          path: Experiments/SDLGPU/fixtures/
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Build and replay (Linux ${{ matrix.arch }}, llvmpipe)
    needs: record
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: fixtures
          path: Experiments/SDLGPU/fixtures
      - uses: docker/setup-buildx-action@v4
      - name: Build image (Swift, SDL3 from source, Mesa, AccessKit)
        uses: docker/build-push-action@v7
        with:
          context: Backends/SDL
          file: Backends/SDL/linux/Dockerfile
          tags: metalui-portable
          load: true
          cache-from: type=gha,scope=portable-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=portable-${{ matrix.arch }}
      - name: Build, test and replay
        # --dump reports every frame, writes raw BGRA, and still fails over tolerance.
        run: |
          mkdir -p Experiments/SDLGPU/linux-dump
          # The whole repo: Backends/SDL depends on the root package. No flags:
          # SDL3 and AccessKit are on the image's default paths (PX-I item 5).
          # METALUI_REQUIRE_GPU=1: a missing GPU is a failure, not a skip (ruling GA-L).
          docker run --rm -e METALUI_REQUIRE_GPU=1 -v "$PWD":/work -w /work/Backends/SDL metalui-portable bash -ec '
            vulkaninfo --summary 2>/dev/null | grep -E "deviceName|driverName" || true
            swift build --scratch-path /tmp/build
            swift test --scratch-path /tmp/build
            $(swift build --scratch-path /tmp/build --show-bin-path)/PortableReplay ../../Experiments/SDLGPU/fixtures --driver vulkan --dump ../../Experiments/SDLGPU/linux-dump --expect 15
            # The demo built HERE, checked against the macOS frame 5 (ruling DC-B; no apostrophes in this single-quoted script).
            $(swift build --scratch-path /tmp/build --show-bin-path)/DemoCapture ../../Experiments/SDLGPU/fixtures --driver vulkan
          '
      - name: A generated cross-platform app builds by URL (tests 1.7, 1.8)
        # The root package's env-gated consumer tests, from /work: each
        # generates a package depending on a file:// copy of this checkout and
        # runs plain `swift build` (PX-L item 3).
        run: |
          docker run --rm -v "$PWD":/work -w /work metalui-portable bash -ec '
            git config --global --add safe.directory "*"
            METALUI_RUN_SDL_CONSUMER_BUILD_TEST=1 swift test --filter aCrossPlatformPackage --scratch-path /tmp/root
          '
      - name: The build-tool plugin under the default build system (XP-G35, BT-X)
        # The same consumer fixture as the Windows job: plain `swift build`, a stub shadercross, the compile arm.
        run: |
          docker run --rm -v "$PWD":/work metalui-portable bash -ec '
            fx=/tmp/plugin-fixture
            cp -R /work/.github/fixtures/build-plugin $fx
            sed "s|@CHECKOUT@|/work|" $fx/Package.swift.in > $fx/Package.swift
            clang -O1 -o $fx/shadercross-stub $fx/shadercross-stub.c
            cd $fx
            METALUI_SHADERCROSS=$fx/shadercross-stub swift build
            test -s "$(find .build -name tri.vert.spv | head -n 1)"
          '
      - name: The X11 window icon reaches _NET_WM_ICON (XP-G37, WI-E)
        # A real SDL window on Xvfb with SDL_VIDEO_DRIVER=x11 (the image defaults to offscreen):
        # IconCheck sets app.icon, then check.sh reads the property back with xprop and walks its
        # width, height, pixels records. One 256 icon, three sizes, and three sizes set after the
        # window opened. xprop's own pretty-printer prints nothing for an icon over about 250
        # pixels (WI-A), so check.sh asks for the raw values.
        run: |
          docker run --rm -v "$PWD":/work -w /work/Backends/SDL metalui-portable bash -ec '
            swift build --scratch-path /tmp/build --product IconCheck
            bin=$(swift build --scratch-path /tmp/build --show-bin-path)
            Xvfb :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &
            xvfb=$!
            timeout 30 sh -c "until xdpyinfo -display :99 >/dev/null 2>&1; do sleep 0.2; done"
            export DISPLAY=:99 SDL_VIDEO_DRIVER=x11
            check=/work/.github/fixtures/x11-icon/check.sh
            status=0
            "$bin/IconCheck" 256 "$check 256x256" || status=1
            "$bin/IconCheck" 16,32,256 "$check \"16x16 32x32 256x256\"" || status=1
            "$bin/IconCheck" 16,32,256 "$check \"16x16 32x32 256x256\"" after || status=1
            kill $xvfb
            exit $status
          '
      - name: The sample app builds and its tests pass (Examples/Jotter, SDL trait; ruling EX-E)
        # A package of its own, a path dependency on this checkout with the SDL and AccessKit
        # traits its manifest turns on for Linux; the image's offscreen video driver is enough
        # because its tests run a headless TestWindow.
        run: |
          docker run --rm -v "$PWD":/work -w /work/Examples/Jotter metalui-portable bash -ec '
            swift build --build-tests --scratch-path /tmp/jotter
            swift test --skip-build --scratch-path /tmp/jotter
          '
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: linux-dump-${{ matrix.arch }}
          path: Experiments/SDLGPU/linux-dump/
          retention-days: 7

  windows:
    name: Build and replay (Windows x64, D3D12)
    needs: record
    runs-on: windows-latest
    env:
      SDL_VERSION: 3.4.16
      SDL_LOGGING: gpu=info   # logs the D3D12 adapter SDL picked
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: fixtures
          path: Experiments/SDLGPU/fixtures
      # The installer intermittently leaves `swift` off PATH (the action's
      # version check fails before any build); one retry after a pause.
      - id: setup-swift
        uses: compnerd/gha-setup-swift@v0.5.0
        continue-on-error: true
        with:
          swift-version: swift-6.4.0-release
          swift-build: 6.4.0-RELEASE
      - name: Pause before retrying Swift setup
        if: steps.setup-swift.outcome == 'failure'
        shell: pwsh
        run: Start-Sleep -Seconds 30
      - name: Retry Swift setup
        if: steps.setup-swift.outcome == 'failure'
        uses: compnerd/gha-setup-swift@v0.5.0
        with:
          swift-version: swift-6.4.0-release
          swift-build: 6.4.0-RELEASE
      - name: Install SDL3 (prebuilt VC package)
        run: |
          $zip = "$env:RUNNER_TEMP\sdl3.zip"
          Invoke-WebRequest "https://github.com/libsdl-org/SDL/releases/download/release-$env:SDL_VERSION/SDL3-devel-$env:SDL_VERSION-VC.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          $root = "$env:RUNNER_TEMP\SDL3-$env:SDL_VERSION"
          "SDL3_INCLUDE=$root\include" >> $env:GITHUB_ENV
          "SDL3_LIB=$root\lib\x64" >> $env:GITHUB_ENV
          "$root\lib\x64" >> $env:GITHUB_PATH   # SDL3.dll at run time
      - name: Fetch AccessKit (ruling AX-A)
        working-directory: Backends/SDL
        # One SwiftPM flag per line: -Xcc -I<include> -Xswiftc -L<lib> (PX-I item 2).
        run: |
          python scripts/fetch-accesskit.py --print-flags > "$env:RUNNER_TEMP\accesskit-flags.txt"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-Content "$env:RUNNER_TEMP\accesskit-flags.txt"
      - name: Adapters
        run: Get-CimInstance Win32_VideoController | Format-Table Name, DriverVersion
      - name: The build-tool plugin under the default build system (XP-G35, BT-X)
        # A consumer fixture applying CompileShadersOnBuild, built by plain `swift build` (swift-build runs
        # the tool with a stripped environment) with a stub shadercross, so the compile arm runs.
        run: |
          $fx = "$env:RUNNER_TEMP\plugin-fixture"
          Copy-Item .github\fixtures\build-plugin $fx -Recurse
          $checkout = $env:GITHUB_WORKSPACE -replace '\\', '/'
          (Get-Content "$fx\Package.swift.in" -Raw).Replace('@CHECKOUT@', $checkout) | Set-Content "$fx\Package.swift" -NoNewline
          clang -O1 -o "$fx\shadercross-stub.exe" "$fx\shadercross-stub.c"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:METALUI_SHADERCROSS = "$fx\shadercross-stub.exe"
          Push-Location $fx
          swift build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $blob = Get-ChildItem .build -Recurse -Filter tri.vert.spv | Where-Object { $_.Length -gt 0 } | Select-Object -First 1
          if (-not $blob) { Write-Error "the plugin's tri.vert.spv is missing or empty"; exit 1 }
          "plugin output: $($blob.FullName)"
      - name: Build, test and replay
        # No pkg-config on Windows: hand SwiftPM SDL's include and library paths.
        working-directory: Backends/SDL
        run: |
          $flags = @("-Xcc", "-I$env:SDL3_INCLUDE", "-Xswiftc", "-L$env:SDL3_LIB") +
                   @(Get-Content "$env:RUNNER_TEMP\accesskit-flags.txt")
          swift build @flags
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # A missing GPU is a failure, not a skip (ruling GA-L).
          $env:METALUI_REQUIRE_GPU = "1"
          swift test @flags
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force ..\..\Experiments\SDLGPU\windows-dump | Out-Null
          $bin = (swift build @flags --show-bin-path)
          & "$bin\PortableReplay.exe" ..\..\Experiments\SDLGPU\fixtures --driver direct3d12 --dump ..\..\Experiments\SDLGPU\windows-dump --expect 15
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # The demo built HERE, checked against macOS's frame 5 (ruling DC-B).
          & "$bin\DemoCapture.exe" ..\..\Experiments\SDLGPU\fixtures --driver direct3d12
          exit $LASTEXITCODE
      - name: Launch the SDL demo (ruling WS-E)
        # The configuration that panicked at launch (item C11): a visible
        # SDLPlatform window with the AccessKit trait. It must still be running
        # after 8 s. A launch smoke, not a test: a slow start can only make it
        # pass falsely; the deterministic check is SDLWindowShowOrderTests.
        working-directory: Backends/SDL
        run: |
          $flags = @("-Xcc", "-I$env:SDL3_INCLUDE", "-Xswiftc", "-L$env:SDL3_LIB") +
                   @(Get-Content "$env:RUNNER_TEMP\accesskit-flags.txt")
          $bin = (swift build @flags --show-bin-path)
          $p = Start-Process "$bin\MetalUISDLDemo.exe" -PassThru `
                 -RedirectStandardError "$env:RUNNER_TEMP\demo.err" -RedirectStandardOutput "$env:RUNNER_TEMP\demo.out"
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            Get-Content "$env:RUNNER_TEMP\demo.out", "$env:RUNNER_TEMP\demo.err"
            Write-Error ("MetalUISDLDemo exited after launch with {0} (0x{0:X8})" -f $p.ExitCode)
            exit 1
          }
          Stop-Process -Id $p.Id
          "MetalUISDLDemo was still running after 8 s"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: windows-dump
          path: Experiments/SDLGPU/windows-dump/
          retention-days: 7

# Release of the `metalui` CLI (ruling SC-J, record 385): a pushed tag `vX.Y.Z`
# builds the CLI, checks it, and publishes a GitHub release with a macOS arm64
# tarball and its sha256. The Homebrew tap formula then points at the release's
# source archive (docs/packaging.md, "Releasing").
name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27  # Swift 6.4 (Xcode 27, preview image), as swift.yml
    steps:
    - uses: actions/checkout@v7

    - name: The tag is v + metaluiVersion
      run: |
        version=$(sed -n 's/^package let metaluiVersion = "\(.*\)"$/\1/p' Sources/MetalUIScaffold/Version.swift)
        if [ -z "$version" ]; then echo "no metaluiVersion in Version.swift"; exit 1; fi
        if [ "$GITHUB_REF_NAME" != "v$version" ]; then
          echo "tag $GITHUB_REF_NAME does not match metaluiVersion $version (expected v$version)"
          exit 1
        fi
        echo "VERSION=$version" >> "$GITHUB_ENV"

    - name: Build
      run: swift build -c release --product metalui

    - name: Smoke test
      run: |
        out=$(.build/release/metalui --version)
        echo "$out"
        [ "$out" = "metalui $VERSION" ]
        scratch=$(mktemp -d)
        (cd "$scratch" && "$GITHUB_WORKSPACE/.build/release/metalui" new Smoke)
        grep -n "MetalUI.git" "$scratch/Smoke/Package.swift"

    - name: Package
      run: |
        archive="metalui-$VERSION-macos-arm64.tar.gz"
        mkdir dist
        cp .build/release/metalui dist/metalui
        tar -C dist -czf "$archive" metalui
        shasum -a 256 "$archive" > "$archive.sha256"
        cat "$archive.sha256"

    - name: Create the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" --generate-notes \
          "metalui-$VERSION-macos-arm64.tar.gz" "metalui-$VERSION-macos-arm64.tar.gz.sha256"

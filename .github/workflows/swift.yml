# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: xcode-27  # Swift 6.4 (Xcode 27, preview image)

    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v --no-parallel

  # MetalUIScene, MetalUIFreeType and MetalUIHarfBuzz must build without Apple
  # frameworks (rulings PS-G, FT-K, SH-K): a Metal, CoreText or CoreGraphics
  # import there fails to compile on Linux, and macOS cannot see that.
  scene-linux:
    runs-on: ubuntu-24.04
    container: swift:6.4-noble
    steps:
    - uses: actions/checkout@v7
    - name: Build MetalUIScene
      run: swift build --target MetalUIScene
    - name: Build MetalUIFreeType
      run: swift build --target MetalUIFreeType
    - name: Build MetalUIHarfBuzz
      run: swift build --target MetalUIHarfBuzz

  # Tests/PortableTests is one package with two test targets, and these jobs run
  # all of it: FreeType's rasterizer output, pinned byte for byte (size,
  # bearings, coverage checksum) from macOS (ruling FT-J), and HarfBuzz's
  # shaping — glyph ids, clusters, design-unit positions and one rasterized
  # end-to-end run — likewise (ruling SH-I). The root package's own tests cannot
  # run off macOS.
  portable-linux:
    name: Portable tests (Linux ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: swift:6.4-noble
    steps:
    - uses: actions/checkout@v7
    - name: Run portable tests
      working-directory: Tests/PortableTests
      run: swift test

  portable-windows:
    name: Portable tests (Windows x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/checkout@v7
    - uses: compnerd/gha-setup-swift@v0.5.0
      with:
        swift-version: swift-6.4.0-release
        swift-build: 6.4.0-RELEASE
    - name: Run portable tests
      working-directory: Tests/PortableTests
      run: |
        swift test
        exit $LASTEXITCODE

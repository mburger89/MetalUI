# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: xcode-27  # Swift 6.4 (Xcode 27, preview image)

    # Native build system, with the typecheck guards REQUIRED (plan task 15,
    # ruling CX-J): under the default build system every guard finds no
    # .build/<triple>/debug/Modules and returns true for free, so none of them
    # ever ran here. METALUI_REQUIRE_GUARDS=1 makes that skip a failure
    # (theTypecheckGuardsRanWhereTheyAreRequired).
    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: swift build -v --build-system native --build-tests
    - name: Run tests
      run: METALUI_REQUIRE_GUARDS=1 swift test -v --build-system native --no-parallel
    # The sample app (ruling EX-E, record 136): its own package, a path dependency on this
    # checkout, built and tested as a user's app is. A red step here is API churn the example
    # has not followed.
    - name: Sample app (Examples/Jotter)
      run: swift test --package-path Examples/Jotter

  # MetalUIScene, MetalUIFreeType, MetalUIHarfBuzz and MetalUIPortableText must
  # build without Apple frameworks (rulings PS-G, FT-K, SH-K, PT-A): a Metal, CoreText or CoreGraphics
  # import there fails to compile on Linux, and macOS cannot see that.
  # The root package on Linux declares only the targets that import no Apple
  # framework (ruling PC-A): MetalUICore, MetalUILayout, MetalUIScene, the
  # vendored C libraries, MetalUIFreeType, MetalUIHarfBuzz,
  # MetalUIPortableText, MetalUIShaderTypes, MetalUITextSystem,
  # MetalUIPlatform, MetalUIPrimitives, MetalUI and MetalUIDemoContent (roadmap
  # items 5–9) and the Core, Layout and cross-platform tests — the last pins
  # the demo's whole frame against macOS (ruling XP-C). An Apple import in any
  # of them fails this job; macOS cannot see one.
  scene-linux:
    name: Root package (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.4-noble
    steps:
    - uses: actions/checkout@v7
    - name: Build every portable target and its tests
      run: swift build --build-tests
    # --no-parallel as on macOS: `Animation.parkedTransaction` is process-global, and an
    # async test that parks one and awaits hands it to another test's first frame.
    - name: Test MetalUICore and MetalUILayout (goldens included)
      run: swift test --skip-build --no-parallel

  root-windows:
    name: Root package (Windows x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/checkout@v7
    # The installer intermittently leaves `swift` off PATH (the action's
    # version check fails before any build); one retry after a pause.
    - id: setup-swift
      uses: compnerd/gha-setup-swift@v0.5.0
      continue-on-error: true
      with:
        swift-version: swift-6.4.0-release
        swift-build: 6.4.0-RELEASE
    - name: Pause before retrying Swift setup
      if: steps.setup-swift.outcome == 'failure'
      shell: pwsh
      run: Start-Sleep -Seconds 30
    - name: Retry Swift setup
      if: steps.setup-swift.outcome == 'failure'
      uses: compnerd/gha-setup-swift@v0.5.0
      with:
        swift-version: swift-6.4.0-release
        swift-build: 6.4.0-RELEASE
    - name: Build every portable target and its tests
      run: |
        swift build --build-tests
        exit $LASTEXITCODE
    # --no-parallel: see the Linux job (a parked transaction crosses tests).
    - name: Test MetalUICore and MetalUILayout (goldens included)
      run: |
        swift test --skip-build --no-parallel
        exit $LASTEXITCODE
    # XP-G21 / WR-D: Windows' 6.4.0+Asserts compiler verified SIL for PaintPass.withRenderEffects in a
    # release-only specialisation and crashed; no debug build sees it. The MetalUI product alone, release.
    - name: Release build of MetalUI (SIL verifier, XP-G21)
      run: |
        swift build -c release --product MetalUI
        exit $LASTEXITCODE

  # Tests/PortableTests is one package with three test targets, and these jobs
  # run all of it: FreeType's rasterizer output, pinned byte for byte (size,
  # bearings, coverage checksum) from macOS (ruling FT-J); HarfBuzz's
  # shaping — glyph ids, clusters, design-unit positions and one rasterized
  # end-to-end run — likewise (ruling SH-I); and the portable text pipeline's
  # emitted glyph rects, atlas dirty rect and coverage (ruling PT-H), and its
  # line breaking's opportunities and wrapped lines (ruling LB-G). The root package's Core and Layout tests run
  # off macOS in the scene-linux and root-windows jobs above; its portable
  # text oracles compare against CoreText and cannot.
  portable-linux:
    name: Portable tests (Linux ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: swift:6.4-noble
    steps:
    - uses: actions/checkout@v7
    - name: Run portable tests
      working-directory: Tests/PortableTests
      run: swift test

  portable-windows:
    name: Portable tests (Windows x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/checkout@v7
    # The installer intermittently leaves `swift` off PATH (the action's
    # version check fails before any build); one retry after a pause.
    - id: setup-swift
      uses: compnerd/gha-setup-swift@v0.5.0
      continue-on-error: true
      with:
        swift-version: swift-6.4.0-release
        swift-build: 6.4.0-RELEASE
    - name: Pause before retrying Swift setup
      if: steps.setup-swift.outcome == 'failure'
      shell: pwsh
      run: Start-Sleep -Seconds 30
    - name: Retry Swift setup
      if: steps.setup-swift.outcome == 'failure'
      uses: compnerd/gha-setup-swift@v0.5.0
      with:
        swift-version: swift-6.4.0-release
        swift-build: 6.4.0-RELEASE
    - name: Run portable tests
      working-directory: Tests/PortableTests
      run: |
        swift test
        exit $LASTEXITCODE

# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: xcode-27  # Swift 6.4 (Xcode 27, preview image)

    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v --no-parallel

  # MetalUIScene, MetalUIFreeType, MetalUIHarfBuzz and MetalUIPortableText must
  # build without Apple frameworks (rulings PS-G, FT-K, SH-K, PT-A): a Metal, CoreText or CoreGraphics
  # import there fails to compile on Linux, and macOS cannot see that.
  # The root package on Linux declares only the targets that import no Apple
  # framework (ruling PC-A): MetalUICore, MetalUILayout, MetalUIScene, the
  # vendored C libraries, MetalUIFreeType, MetalUIHarfBuzz,
  # MetalUIPortableText, MetalUIShaderTypes and the Core and Layout tests —
  # all of them built, and those tests run, here (roadmap item 5). An Apple
  # import in any of them fails this job; macOS cannot see one.
  scene-linux:
    name: Root package (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.4-noble
    steps:
    - uses: actions/checkout@v7
    - name: Build every portable target and its tests
      run: swift build --build-tests
    - name: Test MetalUICore and MetalUILayout (goldens included)
      run: swift test --skip-build

  root-windows:
    name: Root package (Windows x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/checkout@v7
    - uses: compnerd/gha-setup-swift@v0.5.0
      with:
        swift-version: swift-6.4.0-release
        swift-build: 6.4.0-RELEASE
    - name: Build every portable target and its tests
      run: |
        swift build --build-tests
        exit $LASTEXITCODE
    - name: Test MetalUICore and MetalUILayout (goldens included)
      run: |
        swift test --skip-build
        exit $LASTEXITCODE

  # Tests/PortableTests is one package with three test targets, and these jobs
  # run all of it: FreeType's rasterizer output, pinned byte for byte (size,
  # bearings, coverage checksum) from macOS (ruling FT-J); HarfBuzz's
  # shaping — glyph ids, clusters, design-unit positions and one rasterized
  # end-to-end run — likewise (ruling SH-I); and the portable text pipeline's
  # emitted glyph rects, atlas dirty rect and coverage (ruling PT-H), and its
  # line breaking's opportunities and wrapped lines (ruling LB-G). The root package's Core and Layout tests run
  # off macOS in the scene-linux and root-windows jobs above; its portable
  # text oracles compare against CoreText and cannot.
  portable-linux:
    name: Portable tests (Linux ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: swift:6.4-noble
    steps:
    - uses: actions/checkout@v7
    - name: Run portable tests
      working-directory: Tests/PortableTests
      run: swift test

  portable-windows:
    name: Portable tests (Windows x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/checkout@v7
    - uses: compnerd/gha-setup-swift@v0.5.0
      with:
        swift-version: swift-6.4.0-release
        swift-build: 6.4.0-RELEASE
    - name: Run portable tests
      working-directory: Tests/PortableTests
      run: |
        swift test
        exit $LASTEXITCODE

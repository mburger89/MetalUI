# SwiftLint, blocking. Existing violations are frozen in .swiftlint-baseline.json;
# the step prints only violations that are not in it, as PR annotations; --strict makes warnings fail too (without it only errors do).
# See docs/practices/linting.md.
name: Lint

on:
  push:
    branches: [ "master" ]
    paths: [ "**.swift", ".swiftlint.yml", ".swiftlint-baseline.json", ".github/workflows/lint.yml" ]
  pull_request:
    branches: [ "master" ]
    paths: [ "**.swift", ".swiftlint.yml", ".swiftlint-baseline.json", ".github/workflows/lint.yml" ]

# A new push to a pull request (or a non-master branch) cancels its superseded run (as swift.yml).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint:
    name: SwiftLint
    runs-on: ubuntu-24.04
    # Pinned to the version the baseline was written with; Linux, because SwiftLint
    # here is syntactic (no compile) and the container is the fastest start.
    container: ghcr.io/realm/swiftlint:0.65.1
    steps:
    - uses: actions/checkout@v7
    - name: SwiftLint (new violations only)
      run: swiftlint lint --strict --baseline .swiftlint-baseline.json --reporter github-actions-logging

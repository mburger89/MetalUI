<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* CSS Flexbox §4.5 — the content size suggestion is "further clamped by the
     maximum main size if that is definite".

     `.a` declares no width, so it has no specified size suggestion and its
     automatic minimum is its content size suggestion alone: its min-content
     width, which is its 200-wide child. `max-width: 50px` must clamp that:
       clamped   -> min(200, 50) = 50, `.a` 50 wide
       unclamped -> 200 floors the item ABOVE its own max, and a floor beats a
                    max, so `.a` is 200 wide
     WebKit says 50, and the child overflows `.a` at its full 200.

     `.w` is the other side of the same clamp: its `max-width: 300px` is ABOVE
     its 100-wide content, so the clamp must not bite and the minimum stays
     the content's 100. An engine that takes the max as the minimum whenever
     one is declared gives `.w` 300. Both readings fit the row
     (50 + 100 + 50 and 50 + 300 + 50 are within 400), so nothing shrinks and
     `.b`'s x — 150 against 350 — separates them.

     `flex: none` ON THE CHILDREN IS NOT OPTIONAL. Without it a child is a
     shrinkable flex item of its parent, WebKit shrinks it inside `.a`, and the
     child's width stops being a statement about `.a`'s min-content at all —
     a fixture already written that way once, during the review that found
     this, and it proved nothing.

     The root is wide enough that nothing shrinks under any reading above, so
     the only rule that can size `.a` and `.w` is their clamped hypothetical
     main size.

     `.a` and `.w` declare `display: flex` because this engine has no block
     layout and `Style.display` defaults to flex; the HTML has to describe the
     same tree the Swift test builds. */
  #root { display: flex; width: 400px; height: 60px; }
  .a { display: flex; max-width: 50px; }
  .a > div { width: 200px; height: 20px; flex: none; }
  .w { display: flex; max-width: 300px; }
  .w > div { width: 100px; height: 20px; flex: none; }
  .b { width: 50px; height: 20px; }
</style></head><body>
  <div id="root" data-id="root">
    <div class="a" data-id="a"><div data-id="g"></div></div>
    <div class="w" data-id="w"><div data-id="wg"></div></div>
    <div class="b" data-id="b"></div>
  </div>
</body></html>

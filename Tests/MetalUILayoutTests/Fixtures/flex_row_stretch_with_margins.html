<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* fix-round-1 bug 2: a stretched item's cross size ignored its own cross
     margins and filled the WHOLE line, overflowing the container by its
     margins. CSS stretches the margin box, not the border box: available
     border-box height is `containerCross - marginTop - marginBottom`.
     `.b` also carries `max-height`, so this fixture pins the ORDER of that
     arithmetic against the min/max clamp too — subtract margins first, THEN
     clamp what is left, not the other way around. Asymmetric top/bottom on
     both children so a transposed edge cannot hide behind a symmetric one. */
  #root { display: flex; flex-direction: row; width: 400px; height: 100px; }
  .a { width: 50px; margin: 10px 0 25px 0; }
  .b { width: 70px; margin: 15px 0 5px 0; max-height: 50px; }
</style></head><body>
  <div id="root" data-id="root">
    <div class="a" data-id="a"></div>
    <div class="b" data-id="b"></div>
  </div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* Wrapping x nesting x percentage padding — a wrapped container inside a
     wrapped container, whose percentage padding resolves against ITS
     containing block and whose own lines stack inside its content box.

     Probed against WebKit during the wrapping milestone's first task and left
     uncommitted. It is the pair worth committing most: percentage padding x
     nesting is where the box-model milestone found a real engine bug (the
     basis was the box's OWN width), and wrapping adds a second level of
     "which box am I measuring against" on top of it.

     THE BASIS. `.mid` is 200 wide and sits in a root whose CONTENT box is 380.
     Its `padding: 5%` is therefore 19 on all four edges — including top and
     bottom, which take the containing block's WIDTH, not its height. Four
     candidate bases give four different answers and every one of them moves
     the grandchildren:

       380 (the containing block's width, correct)  -> 19
       200 (the box's own width)                    -> 10
       400 (the root's BORDER box)                  -> 20
       120 (the box's own height, for top/bottom)   ->  6

     `.mid` is 200x120 — deliberately non-square, and deliberately not as wide
     as its parent's content box — so no two of those coincide.

     Root breaks (main extent 380): 120 + 200 = 320 <= 380, +90 = 410 > 380
       -> line 0 = [lead, mid] (cross 120), line 1 = [tail] (cross 40)
     Root content box starts at (10, 10):
       lead 10,10   mid 130,10   tail 10,130

     `.mid`'s content box is 200 - 38 = 162 wide, 120 - 38 = 82 tall, starting
     at (130 + 19, 10 + 19) = (149, 29). Its own breaks:
       70 + 80 = 150 <= 162, +60 = 210 > 162  -> [g1, g2] (cross 25), [g3]
       g1 149,29   g2 219,29   g3 149,54

     The inner line stack is what makes this a WRAPPING fixture rather than a
     second padding one: `g3` at 54 is 29 + 25, i.e. line 1 starts below line
     0's measured cross size INSIDE the padded content box. A container that
     stacked its lines from the border box would put g3 at 35.

     Sibling swap — the good one changes NO child declaration:
     `#root { padding: 10px }` -> `30px` shrinks the root's content box to 340,
     so `.mid`'s 5% becomes 17. Measured in the browser: every box moves, and
     the grandchildren move by MORE than their parent does. `.mid` shifts by
     the root's extra 20 alone, (130,10) -> (150,30); `g1` shifts by 20 + the
     padding's own 18 - 20 = 18 and 18, (149,29) -> (167,47); `g3` lands at
     (167,72). The root's line shape is unchanged (320 <= 340, 410 > 340), so
     the grandchildren move for exactly one reason — the percentage's basis.
     (An earlier draft of this paragraph put g3 at (167,52); it had subtracted
     the padding change and forgotten the root's own 20px shift, which is the
     reason this swap is measured and not derived.) Swapping `.mid`'s
     `padding: 5%` -> `19px` is a deliberate no-op and proves nothing. */
  #root { display: flex; flex-direction: row; flex-wrap: wrap;
          align-content: flex-start; padding: 10px;
          width: 400px; height: 300px; }
  .lead { width: 120px; height: 30px; }
  .mid  { width: 200px; height: 120px; padding: 5%;
          display: flex; flex-direction: row; flex-wrap: wrap;
          align-content: flex-start; }
  .tail { width: 90px; height: 40px; }
  .g1 { width: 70px; height: 20px; }
  .g2 { width: 80px; height: 25px; }
  .g3 { width: 60px; height: 15px; }
</style></head><body>
  <div id="root" data-id="root">
    <div class="lead" data-id="lead"></div>
    <div class="mid" data-id="mid">
      <div class="g1" data-id="g1"></div>
      <div class="g2" data-id="g2"></div>
      <div class="g3" data-id="g3"></div>
    </div>
    <div class="tail" data-id="tail"></div>
  </div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* Ruling TX-H. CSS Flexbox §9.4 step 7 determines an item's hypothetical
     cross size "by performing layout with the USED main size" — after step 6
     has resolved the flexible lengths. This engine computes it in the same
     pass as the HYPOTHETICAL main size, so an item about to shrink keeps the
     cross size it had at its unshrunk width.

     `.a` is a wrapping flex container of four 50x20 items: min-content 50,
     max-content 200, and a height that depends on which width it is laid out
     at. That is the one shape in this repo that can tell the two apart without
     a font — ruling TX-B forbids a text fixture.

     `.a` shrinks from its 200 max-content to the root's 120, which fits two
     items per line, so two lines, so 40 tall. This engine measures its height
     at the unshrunk 200 — one line — and answers 20.

     WebKit: a = 120 x 40. This engine: 120 x 20.

     `align-items: flex-start` IS LOAD-BEARING. Under the default `stretch` an
     item takes its cross size from the LINE rather than from itself, and the
     two engines already agree (both 600) — so a fixture that stretches pins
     nothing. This is the differential that names `ownCross` as the site. */
  #root { display: flex; width: 120px; height: 600px; align-items: flex-start; }
  .a { display: flex; flex-wrap: wrap; }
  .a > div { width: 50px; height: 20px; }
</style></head><body>
  <div id="root" data-id="root">
    <div class="a" data-id="a">
      <div data-id="i1"></div><div data-id="i2"></div>
      <div data-id="i3"></div><div data-id="i4"></div>
    </div>
  </div>
</body></html>

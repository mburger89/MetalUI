<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* A stack as ONE ITEM of a flex row, with siblings on both sides. This is
     the half of the nesting composition `layOutChildren`'s branch on
     `display` could get backwards: a stack whose PARENT is a flex container
     must contribute its own measured size (max over its children, on each
     axis independently) to the row's line, not the sum its children would
     produce if the dispatch fell through to the flex path.

     `.stack`'s own contribution is `max(90, 20) = 90` wide, `max(10, 70) = 70`
     tall -- never `90 + 20 = 110`, which is what a stack that summed its
     children like a flex row would report. `.before` and `.after` exist so
     that contribution is visible as a POSITION shift on `.after`, not only as
     the stack's own width: `.after` sits at `40 + 90 = 130`, which would be
     `40 + 110 = 150` under the summing bug.

     `align-items: flex-start` keeps the row's cross axis from stretching the
     stack to the row's full 150px height, which would hide the 70px the
     stack itself measures.

     `.mid` (50x40) wins NEITHER axis and is FIRST in document order. It
     contributes nothing to the numbers this fixture is named for -- it exists
     only so that a "the container's size is its first child's size" bug
     cannot pass here by coincidence. It could, before: this fixture shipped
     with `.wide` first, where `wide.width == max(...).width == 90`, and
     mutating the engine's width accumulator to take only the first child left
     it green. Same correction as `stack_sizes_to_largest.html`. */
  #root { display: flex; flex-direction: row; width: 400px; height: 150px;
          align-items: flex-start; }
  .before { width: 40px; height: 30px; }
  .after  { width: 60px; height: 20px; }
  /* The stack: one cell, children overlapped, sized to the largest. */
  #stack { display: grid; justify-items: center; align-items: center; }
  #stack > div { grid-area: 1 / 1; }
  .mid  { width: 50px; height: 40px; }
  .wide { width: 90px; height: 10px; }
  .tall { width: 20px; height: 70px; }
</style></head><body>
  <div id="root" data-id="root">
    <div class="before" data-id="before"></div>
    <div id="stack" data-id="stack">
      <div class="mid" data-id="mid"></div>
      <div class="wide" data-id="wide"></div>
      <div class="tall" data-id="tall"></div>
    </div>
    <div class="after" data-id="after"></div>
  </div>
</body></html>

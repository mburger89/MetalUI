<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* Column container, strongly non-square (120x400). Every value below is a
     pixel length — this fixture does NOT exercise percentage padding, and
     nothing in the corpus does yet. The non-square shape buys nothing on its
     own today; it is chosen so that Task 3's percentage-padding fixture can
     reuse it to tell a percentage resolved against width from one resolved
     against height, which a square box could not distinguish. Padding and
     border differ, and every edge on both axes is a distinct value, so a
     transposed axis or a dropped edge cannot pass. Children have auto width:
     stretch filling the reduced *content* width is the strongest single
     check that the content box reached the cross axis. */
  #root { display: flex; flex-direction: column; width: 120px; height: 400px;
          padding: 12px 30px 6px 18px;
          border-style: solid; border-color: black;
          border-width: 4px 2px 8px 6px; }
  .a { height: 40px; }
  .b { height: 90px; }
  .c { height: 60px; }
</style></head><body>
  <div id="root" data-id="root">
    <div class="a" data-id="a"></div>
    <div class="b" data-id="b"></div>
    <div class="c" data-id="c"></div>
  </div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* Ruling BM-3: a CHILD's percentage size resolves against its parent's
     CONTENT box, not its border box. `collectItems` already passes the content
     box down as `containerSize`, and `contentBox`'s `parent` binding is built
     from it — correct by construction, and reached by nothing in the corpus
     until this fixture. Mutating that binding back to the border box reddened
     no test at all.

     Content box: 400 - 30 - 50 - 10 - 10 = 300 wide,
                  200 - 20 - 30 -  5 -  5 = 140 tall, at (40, 25).

     Content-box basis (correct):  .a 150 x 70,  .b height 35
     Border-box basis  (the bug):  .a 200 x 100, .b height 50

     `.a` is a percentage on BOTH axes, so a fix that threads the content box
     into the main axis alone and leaves the cross axis on the border box still
     reddens. `.b` mixes a pixel width with a percentage height, so the two
     axes cannot be confused for one another, and it also pins the packing
     origin: it starts at 40 + 150 = 190, which moves under either mutation.

     Every padding and border edge is distinct, and no two of them sum to the
     same inset, so a dropped edge cannot hide. */
  #root { display: flex; flex-direction: row; width: 400px; height: 200px;
          padding: 20px 50px 30px 30px;
          border-style: solid; border-color: black;
          border-width: 5px 10px 5px 10px; }
  .a { width: 50%; height: 50%; }
  .b { width: 60px; height: 25%; }
</style></head><body>
  <div id="root" data-id="root">
    <div class="a" data-id="a"></div>
    <div class="b" data-id="b"></div>
  </div>
</body></html>

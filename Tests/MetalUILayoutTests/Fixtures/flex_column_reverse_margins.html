<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* The column counterpart of `flex_row_reverse_margins`: the same
     physical-vs-flex-relative bug, but on the vertical axis, where the
     physical-start margin is `top` rather than `left`. A fix verified only on
     `row-reverse` could still transpose top/bottom here and nothing would
     catch it — this fixture is why that fix must generalise, not special-case
     rows. Three children, different heights, asymmetric margins on both
     axes. */
  #root { display: flex; flex-direction: column-reverse; width: 100px; height: 400px; }
  .a { width: 30px; height: 50px; margin: 10px 15px 30px 5px; }
  .b { width: 40px; height: 60px; margin: 20px 8px 4px 2px; }
  .c { width: 20px; height: 40px; margin: 6px 1px 18px 12px; }
</style></head><body>
  <div id="root" data-id="root">
    <div class="a" data-id="a"></div>
    <div class="b" data-id="b"></div>
    <div class="c" data-id="c"></div>
  </div>
</body></html>

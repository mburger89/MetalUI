<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* Main and cross extents are deliberately far apart — 700 wide, 100 tall —
     because this fixture exists to pin WHICH extent a percentage flex-basis
     resolves against. `flexBaseSize` takes `containerMain` and `containerCross`
     as two separate parameters, and Task 2 pinned the choice *inside* that
     function; nothing pinned the wiring at `collectItems`' call site. Swapping
     the two arguments left 113/113 green before this fixture existed, because
     no fixture in the corpus used a percentage basis at all.

     Correct (percent resolves against the row's main axis, 700):
       a = 350, b = 175, c = 120.
     With the two arguments transposed (percent resolves against 100):
       a =  50, b =  25, c = 120.
     `c` is in pixels on purpose: it is the control that must not move either way.

     The percentages are unequal, so this also cannot be satisfied by an engine
     that resolves percentages against some third quantity that happens to be
     700 — 50% and 25% of the same base are the only pair that gives 350/175.

     Differential check: replacing `50%`/`25%` with `auto` gives a = b = 0
     (no measure function, no definite main size), so the key declaration is
     load-bearing. */
  #root { display: flex; flex-direction: row; width: 700px; height: 100px; }
  .a { flex: 0 0 50%; }
  .b { flex: 0 0 25%; }
  .c { flex: 0 0 120px; }
</style></head><body>
  <div id="root" data-id="root">
    <div class="a" data-id="a"></div>
    <div class="b" data-id="b"></div>
    <div class="c" data-id="c"></div>
  </div>
</body></html>

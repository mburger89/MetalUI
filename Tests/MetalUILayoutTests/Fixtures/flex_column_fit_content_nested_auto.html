<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* An INDEFINITE cross extent — the case the fit-content branch must reach by
     propagating the container's own intrinsic question instead of a number.

     `.col` declares no width, so when the root measures it there is no cross
     extent to shrink-to-fit against. `.col`'s min-content width is what the root
     needs, and `ownCross` is the site that computes it: with the cross axis
     hardcoded to max-content — which is what it was before this fix, and what it
     still is in a ROW — `.col` reports 200 as BOTH of its intrinsic widths, the
     root's fit-content collapses to `max(200, 120) = 200`, and the whole subtree
     hangs 40 off each side. WebKit puts `.col` at 120.

     `.mark` IS THE SECOND OBSERVABLE, and the root is 60 wide rather than 120
     so that it is a load-bearing one. `.mark` is 70 wide and `.a`'s min-content
     is 50, so `.col`'s min-content is `.mark`'s 70 — the fit-content floor binds
     at 70 and "a column's min-content is the max over its items" is pinned
     rather than assumed. A draft of this file used a 120-wide root, where the
     floor never binds and `.mark`'s only contribution is a y coordinate.

     This is the fourth intrinsic-propagation site (ruling CS-H). It is guarded
     here and by `theCrossAxisQueryReachesAnAutoCrossItem` in
     `IntrinsicModeTests`. */
  #root { display: flex; flex-direction: column; align-items: center;
          width: 60px; height: 400px; }
  .col { display: flex; flex-direction: column; align-items: center; }
  .a { display: flex; flex-wrap: wrap; }
  .k { width: 50px; height: 20px; }
  .mark { width: 70px; height: 16px; }
</style></head><body>
  <div id="root" data-id="root">
    <div class="col" data-id="col">
      <div class="a" data-id="a">
        <div class="k" data-id="k1"></div><div class="k" data-id="k2"></div>
        <div class="k" data-id="k3"></div><div class="k" data-id="k4"></div>
      </div>
      <div class="mark" data-id="mark"></div>
    </div>
  </div>
</body></html>

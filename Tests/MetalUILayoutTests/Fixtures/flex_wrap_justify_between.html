<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* Wrapping x `justify-content` — the SECOND composition a reviewer proved
     unpinned: it made `justify-content` take its free space from the LINE
     rather than the container and all 184 tests stayed green.

     WHAT IT PINS. Each line distributes ITS OWN main free space, measured
     against the container's main extent. Two lines with different item counts
     and different used extents therefore get different distributions:

       line 0 = [a, b]       used 185 of 300 -> 115 free, 1 gap  -> between 115
       line 1 = [c, d, e]    used 280 of 300 ->  20 free, 2 gaps -> between 10

     Under the "free space is the line's own used extent" model both lines have
     zero free space and everything packs at main-start. Under a single
     container-wide distribution both lines would share ONE `between` value.
     115 and 10 agree with neither.

     THE ITEM COUNTS DIFFER ON PURPOSE (2 and 3). `space-between` divides by
     `count - 1`, so two lines of equal count could hide a wrong divisor that
     happened to cancel; 115/1 and 20/2 cannot.

     `gap: 11px 5px` is asymmetric and both halves are load-bearing: the 5px
     column-gap is counted BOTH in the break decision and in each line's
     content size (a trailing gap would overstate the content by 5 and move
     every justified item), and the 11px row-gap is the space between the
     lines.

     Breaks (column-gap 5, main extent 300):
       80, +5+100 = 185 <= 300, +5+120 = 310 > 300  -> line 0 = [a, b]
       120, +5+90 = 215, +5+60 = 280 <= 300         -> line 1 = [c, d, e]

     Expected: a 0, b 200 (80+5+115); c 0, d 135 (120+5+10), e 240
     (135+90+5+10), and e closes on the container's right edge at 300.
     Cross: line 0 is 30 tall, line 1 is 40, row-gap 11 -> y = 0 and 41.

     Sibling swap, measured in the browser rather than derived:
     `justify-content: space-between` -> `flex-start` moves b 200->85,
     d 135->125 and e 240->220 — three items by three DIFFERENT deltas (115,
     10, 20), because each line's free space is its own and `.e` collects two
     lots of line 1's. */
  #root { display: flex; flex-direction: row; flex-wrap: wrap;
          justify-content: space-between; align-content: flex-start;
          gap: 11px 5px;
          width: 300px; height: 150px; }
  .a { width: 80px;  height: 20px; }
  .b { width: 100px; height: 30px; }
  .c { width: 120px; height: 25px; }
  .d { width: 90px;  height: 40px; }
  .e { width: 60px;  height: 15px; }
</style></head><body>
  <div id="root" data-id="root">
    <div class="a" data-id="a"></div>
    <div class="b" data-id="b"></div>
    <div class="c" data-id="c"></div>
    <div class="d" data-id="d"></div>
    <div class="e" data-id="e"></div>
  </div>
</body></html>

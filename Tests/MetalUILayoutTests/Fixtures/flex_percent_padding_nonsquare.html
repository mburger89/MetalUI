<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* The FIRST fixture in the corpus with percentage padding. It pins two
     rules at once, and the shape is chosen so that each has its own mutation.

     RULE 1 — the basis is the containing block's WIDTH on every edge, top and
     bottom included. That is why #root is 400x100 and not square: on a square
     box both bases agree, which is why `resolveEdges` documented this from M1a
     with nothing able to distinguish it, and why mutating `contentBox`'s
     percentage basis to a height was green through two whole tasks.

     RULE 2 — the basis is the CONTAINING BLOCK's width, not the box's own.
     #root is 400 wide inside an 800-wide viewport, so the two differ by 2x on
     every edge. `contentBox` used the box's own border-box width until Task 3;
     this fixture is half of what caught it (`flex_nested_percent_padding` is
     the other half, one level down).

     Correct (containing block = body, 800 wide):
       top 40, right 16, bottom 24, left 32 -> content box 352 x 36 at (32, 40)
     Own-width basis (400):  top 20, right  8, bottom 12, left 16
     Containing-block HEIGHT basis (600): top 30, bottom 18

     Every edge is a different percentage, so a dropped or transposed edge
     cannot hide behind a uniform value, and no edge resolves to the same
     number under any two of the three models. The percentages are kept small
     on purpose: larger ones make padding exceed the 100px height and drag in
     ruling BM-4's over-constrained-box divergence, which this fixture is not
     about — the first draft used `10% 5% 4% 15%` and WebKit grew the root to
     112 tall, entangling the two.

     `.b` has no height at all: it stretches to the content box's height, so
     the vertical basis shows up in a SIZE as well as an origin, and a mutation
     that insets the origin correctly while computing the wrong content height
     still reddens.

     Percentage BORDER is deliberately absent: `border-width` takes no
     percentage in CSS, so `resolveEdges`' percentage path on `Style.border`
     has no browser-checkable counterpart and is unreachable from any fixture. */
  #root { display: flex; flex-direction: row; width: 400px; height: 100px;
          padding: 5% 2% 3% 4%; }
  .a { width: 50px; height: 20px; }
  .b { width: 60px; }
</style></head><body>
  <div id="root" data-id="root">
    <div class="a" data-id="a"></div>
    <div class="b" data-id="b"></div>
  </div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* The containing block: `relative`, so an absolute descendant resolves here.
     `padding: 5px`, no border, is what makes its PADDING box (0, 0) — the
     absolute box's answer — differ from its CONTENT box (5, 5), which is
     where a wrong implementation using #root's immediate static child as the
     containing block would coincidentally land. Without this padding the
     whole fixture discriminates nothing. */
  #root { position: relative; width: 200px; height: 100px; padding: 5px; }
  /* A STATIC wrapper. The absolute box inside it must skip past it — a
     `.static` ancestor is never a containing block — and resolve against
     #root instead. `.spacer` does no work for that property; it only keeps
     `.abs` from being `.wrapper`'s sole/first child. */
  .wrapper { display: flex; flex-direction: row; }
  .spacer { width: 60px; height: 10px; }
  .abs { position: absolute; left: 0; top: 0; width: 20px; height: 10px; }
</style></head><body>
  <div id="root" data-id="root">
    <div class="wrapper"><div class="spacer"></div><div class="abs" data-id="abs"></div></div>
  </div>
</body></html>

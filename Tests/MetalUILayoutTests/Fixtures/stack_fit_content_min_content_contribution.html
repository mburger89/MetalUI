<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* A stack's MIN-CONTENT width is its widest child's min-content, not its
     widest child's max-content -- the intrinsic half of the fit-content rule
     `stack_fit_content_inline` pins for a definite stack.

     `#stack` is an auto-sized item of a 100-wide flex row. Its child `.w` is a
     wrapping row of four 50x20 items: min-content 50, max-content 200. As a
     flex item the stack's base size is its max-content (200), it shrinks
     toward 100, and CSS Sizing 4.5's automatic minimum floors it at its
     min-content width. That floor is 50, so the stack shrinks all the way to
     100 and `.w` wraps two per line inside it: stack 100x40.

     An engine that measures a stack child at max-content whatever the stack
     was asked reports the stack's min-content as 200, the floor beats the
     shrink, and the stack stays 200 wide in a 100-wide row -- with `.w`
     200x20 inside it. A definite-width-only fix does not reach this: the
     floor probe asks the stack a min-content question with no width, so
     there is no definite extent to fit against.

     `justify-items`/`align-items` are stated explicitly because grid defaults
     both to stretch and this framework's Stack does not (spec section 2);
     `start` for the reason `stack_fit_content_floor` gives. */
  #root { display: flex; align-items: flex-start; width: 100px; height: 300px; }
  #stack { display: grid; justify-items: start; align-items: start; }
  #stack > div { grid-area: 1 / 1; }
  .wrapper { display: flex; flex-wrap: wrap; }
  .k { width: 50px; height: 20px; }
</style></head><body>
  <div id="root" data-id="root">
    <div id="stack" data-id="stack">
      <div class="wrapper" data-id="w">
        <div class="k" data-id="w1"></div><div class="k" data-id="w2"></div>
        <div class="k" data-id="w3"></div><div class="k" data-id="w4"></div>
      </div>
    </div>
  </div>
</body></html>

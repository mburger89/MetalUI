<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* Both `left` and `right` set, plus an explicit width: CSS drops `right`
     (LTR) and positions from `left`. `top` and `bottom` are both explicit
     too, and DIFFERENT (10 and 20, not both 0), so height genuinely
     stretches between them rather than merely filling the containing block —
     with both at 0 the stretched height (100) and the all-auto fallback's
     height are the same number, and the rule under test is not exercised at
     all. */
  #root { position: relative; width: 200px; height: 100px; }
  .abs { position: absolute; top: 10px; right: 30px; bottom: 20px; left: 40px; width: 50px; }
</style></head><body>
  <div id="root" data-id="root">
    <div class="abs" data-id="abs"></div>
  </div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* The containing block of a flex item is its flex container's CONTENT box,
     so a nested container's percentage padding resolves against the parent's
     content width — not against the nested box's own width, and not against
     the parent's border box. This fixture is the probe that found the bug:
     `contentBox` resolved percentages against `borderBox.width`, the box's
     own size, until Task 3.

     #root's content box is 400 - 60 - 40 - 20 - 10 = 270 wide, at x = 80.
     `.mid` is 200 wide with `padding: 10%`, so its padding is:

       10% of 270 (correct, the parent's CONTENT width) -> 27, .g1 at x = 107
       10% of 200 (the box's own width, the bug)        -> 20, .g1 at x = 100
       10% of 400 (the parent's BORDER box)             -> 40, .g1 at x = 120
       10% of 147 (the parent's content HEIGHT)         -> 14.7, if the axis
                                                           basis also slipped

     Measured in WebKit: 107. All four models are distinguishable, which is
     the whole point of the asymmetric pixel padding and border on #root —
     with a symmetric or absent outer inset, the parent's content box and its
     border box would coincide and two of the four would collapse.

     `.g2` grows into what is left of `.mid`'s content width: 200 - 27 - 27 -
     20 = 126 under the correct basis, 140 under the own-width one. So the
     nested content box's SIZE is load-bearing here, not only its origin —
     with a single grandchild, "inset the inner origin" and "shrink the inner
     content box" would be indistinguishable.

     `.mid` carries no border: `border-width` takes no percentage in CSS, and
     a pixel border here would only repeat what `flex_nested_padding` already
     pins. */
  #root { display: flex; flex-direction: row; width: 400px; height: 200px;
          padding: 15px 40px 25px 60px;
          border-style: solid; border-color: black;
          border-width: 5px 10px 8px 20px; }
  .mid { display: flex; flex-direction: row; width: 200px; height: 100px;
         padding: 10%; }
  .g1 { width: 20px; height: 10px; }
  .g2 { flex: 1 1 0; height: 10px; }
</style></head><body>
  <div id="root" data-id="root">
    <div class="mid" data-id="mid">
      <div class="g1" data-id="g1"></div>
      <div class="g2" data-id="g2"></div>
    </div>
  </div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* The composition the brief did not enumerate: `flex-grow`, `justify-content:
     space-between`, and margins on every child, together. `.a`'s `max-width`
     caps its growth so free space survives growth for `space-between` to
     distribute — without that cap a fully-grown line has zero leftover space
     and `space-between` is a no-op, which would not exercise this at all.
     This is the browser-checked proof that the engine's two separate margin
     paths — the grow budget shrunk by total margin in `layoutContainer`, and
     the outer-size content total `positionItems` feeds to `justify-content`
     — agree with each other rather than double-counting or disagreeing. */
  #root { display: flex; flex-direction: row; justify-content: space-between;
          width: 400px; height: 100px; }
  .a { flex: 1 1 0; max-width: 150px; height: 40px; margin: 4px 15px 6px 9px; }
  .b { width: 60px; height: 40px; margin: 2px 25px 8px 3px; }
  .c { width: 50px; height: 40px; margin: 12px 4px 1px 18px; }
</style></head><body>
  <div id="root" data-id="root">
    <div class="a" data-id="a"></div>
    <div class="b" data-id="b"></div>
    <div class="c" data-id="c"></div>
  </div>
</body></html>

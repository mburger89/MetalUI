<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* Same root as the other three alignment fixtures -- this is the fourth leg
     of the differential, and the one CSS's real default (`stretch`) and this
     framework's real default (centre) disagree about (spec §2).

     The child is deliberately UNSIZED here, unlike the other three's 20x10.
     CSS Box Alignment's `stretch` only fills the cell when the item's own
     width/height is `auto`; a box with an explicit size falls back to `start`
     and keeps its own size -- verified against this repo's own oracle before
     writing this fixture (a 20x10 child under `justify-items: stretch;
     align-items: stretch` measured 20x10 at (0,0), not 300x200). This
     framework's `Stack` does not carry that carve-out -- `positionStackItems`
     overrides a stretched item's size unconditionally, matching CSS's own
     answer for an auto-sized box. An explicit-size child would make this
     fixture disagree with the engine for a reason that is CSS's fine print,
     not a stack bug, so the child here is auto-sized to exercise the same
     stretch this framework implements. */
  #root { display: grid; justify-items: stretch; align-items: stretch;
          width: 300px; height: 200px; }
  #root > div { grid-area: 1 / 1; }
</style></head><body>
  <div id="root" data-id="root">
    <div data-id="child"></div>
  </div>
</body></html>

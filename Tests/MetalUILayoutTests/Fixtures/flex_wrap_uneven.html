<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* Wrapping x line cross sizing — the first wrapped fixture in the corpus.

     Four uniformity traps are deliberately avoided, one per design choice:

     1. MAIN SIZES ARE UNEVEN (60/90/40/25/50/120). All-equal widths make
        "break when the line is full" indistinguishable from "break every N
        items", and every line would then hold the same count.

     2. THE CONTAINER IS 218px, NOT A ROUND NUMBER. That is exactly
        60 + 14 + 90 + 14 + 40 = 218, so `.c` closes line 0 TO THE PIXEL.
        CSS §9.3 breaks when the next item "would not fit"; an item that fits
        exactly fits, so `.c` stays. This is the corpus's only exact-fit
        boundary and it is what makes `>` distinguishable from `>=` — with
        `>=`, `.c` starts a new line and everything after it shifts. Do not
        "tidy" this width to 220.

     3. THE GAP IS ASYMMETRIC (row 8, column 14) AND LOAD-BEARING ON BOTH
        AXES. Both `gap` call sites in the engine read the MAIN-axis
        component, so a row silently dropped its `row-gap` until wrapping gave
        it a meaning (the space between lines). Equal axes would make reading
        the wrong one invisible — the same trap `flex_row_gap`'s asymmetric
        `Axes` was written for.

        `.d` is 25px wide for the column half specifically. A gap-blind break
        decision packs 60 + 90 + 40 + 25 = 215 <= 218 and puts FOUR items on
        line 0, giving [4, 2] where the correct answer is [3, 2, 1]. The
        fixture's first draft had `.d` at 70px, and dropping gaps from the
        break decision then produced the identical line shape — the unit test
        `gapsCountTowardTheBreakDecision` reddened and no fixture did, so
        nothing browser-checked that WebKit counts gaps the same way we do.
        `.d` must stay <= 28 (= 2 x 14, the gaps line 0 gives back) or that
        blindness returns.

     4. NO TWO LINES HAVE THE SAME CROSS SIZE (35, 45, 30), and on line 0 the
        tallest item is the MIDDLE one while on line 1 it is the LAST. A line
        measured from its first item, its last item, or the container would
        each give a different, wrong stack.

     `align-content: flex-start` is declared rather than left to the initial
     `stretch`: the engine does not implement `align-content` until Task 2, and
     a fixture must never encode a divergence. With `stretch` WebKit would
     grow all three lines to fill the 200px content box; with `flex-start` it
     packs them at cross-start and leaves 74px unused, which is what the
     engine does today AND what it will still do under this declaration once
     Task 2 lands.

     Expected: line 0 y=0 h=35 [a,b,c], line 1 y=43 h=45 [d,e],
               line 2 y=96 h=30 [f]. */
  #root { display: flex; flex-direction: row; flex-wrap: wrap;
          align-content: flex-start; gap: 8px 14px;
          width: 218px; height: 200px; }
  .a { width: 60px;  height: 20px; }
  .b { width: 90px;  height: 35px; }
  .c { width: 40px;  height: 25px; }
  .d { width: 25px;  height: 15px; }
  .e { width: 50px;  height: 45px; }
  .f { width: 120px; height: 30px; }
</style></head><body>
  <div id="root" data-id="root">
    <div class="a" data-id="a"></div>
    <div class="b" data-id="b"></div>
    <div class="c" data-id="c"></div>
    <div class="d" data-id="d"></div>
    <div class="e" data-id="e"></div>
    <div class="f" data-id="f"></div>
  </div>
</body></html>

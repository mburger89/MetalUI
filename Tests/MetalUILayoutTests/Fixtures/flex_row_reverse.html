<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* flex-direction: row-reverse with three unequal children and free space in
     a 400px container (they sum to 160). row-reverse is identical to row
     whenever there is one item, or items that exactly fill the container —
     neither holds here, so the numbers move under that swap. Default
     justify-content: flex-start packs against the *reversed* start, which is
     the container's physical right edge. */
  #root { display: flex; flex-direction: row-reverse;
          width: 400px; height: 40px; }
  .a { width: 40px; height: 40px; }
  .b { width: 70px; height: 40px; }
  .c { width: 50px; height: 40px; }
</style></head><body>
  <div id="root" data-id="root">
    <div class="a" data-id="a"></div>
    <div class="b" data-id="b"></div>
    <div class="c" data-id="c"></div>
  </div>
</body></html>

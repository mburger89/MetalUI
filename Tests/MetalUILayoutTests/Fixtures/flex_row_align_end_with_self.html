<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* align-items: flex-end on the container, align-self: center on .b only —
     pins both the container default and the per-item override in one fixture.
     Heights are 20/60/40, none equal to the 100px line, so the three items
     land at three different y offsets (a: 80, b: 20 via its override, c: 60)
     rather than the uniform result a same-height set would produce. */
  #root { display: flex; flex-direction: row; align-items: flex-end;
          width: 400px; height: 100px; }
  .a { width: 40px; height: 20px; }
  .b { width: 70px; height: 60px; align-self: center; }
  .c { width: 50px; height: 40px; }
</style></head><body>
  <div id="root" data-id="root">
    <div class="a" data-id="a"></div>
    <div class="b" data-id="b"></div>
    <div class="c" data-id="c"></div>
  </div>
</body></html>

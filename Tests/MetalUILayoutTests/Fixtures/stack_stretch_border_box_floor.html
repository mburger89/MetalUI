<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* A stretched stack child's border box never goes below its own padding +
     border (ruling BM-4), and the floor applies AFTER its min/max clamp. The
     cell is 100x100; each child carries `padding: 60px 50px; border: 10px`, a
     floor of 120x140, so both overflow the cell on both axes.

     `.f` has no max: stretched to 100x100 it must still be 120x140.
     `.c` adds `max-width: 40px; max-height: 50px`, both below the floor: WebKit
     gives 120x140, not 40x50 — clamp then floor, the order `borderBoxFloor`'s
     doc records for every other site. Floor-then-clamp gives 40x50 here; no
     floor at all gives 100x100 for `.f` and 40x50 for `.c`.

     Both children have the same 120x140 contribution, so the grid's auto track
     grows to exactly that and stretching either into it gives the same box; a
     stack stretches both into its own 100x100 content box and floors them. The
     grid's growth therefore cannot tell the two models apart here, which is what
     lets the siblings share a cell (see `stack_stretch_min.html` for the case
     where it would). */
  #root { display: grid; justify-items: stretch; align-items: stretch;
          width: 100px; height: 100px; }
  #root > div { grid-area: 1 / 1; padding: 60px 50px; border: 10px solid; }
  .c { max-width: 40px; max-height: 50px; }
</style></head><body>
  <div id="root" data-id="root">
    <div data-id="f"></div>
    <div class="c" data-id="c"></div>
  </div>
</body></html>

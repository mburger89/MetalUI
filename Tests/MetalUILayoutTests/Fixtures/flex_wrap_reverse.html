<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* `wrap-reverse` x `align-items` / `align-self` — CSS Flexbox §8.3 flips the
     WHOLE CROSS AXIS, not just the order the lines are stacked in.

     TWO FLIPS, NOT ONE, and this fixture separates them:

     1. THE LINE STACK. Lines pack from the container's cross-END, so
        `align-content: flex-start` puts line 0 at the BOTTOM. Line 0 (40 tall)
        occupies 260..300 and line 1 (90 tall) sits above it at 170..260.

     2. EACH ITEM INSIDE ITS LINE. `flex-start` means the line's flipped
        cross-start — its BOTTOM edge — and `flex-end` its top. Reversing the
        lines array alone gets flip 1 and not flip 2, and every item on a line
        then sits at that line's top:

          a  default (stretch, but an explicit height, so cross-start)
             -> line 0's bottom: 300 - 20 = 280      (array-reversal: 260)
          b  align-self: flex-end -> line 0's TOP    = 260   (same either way,
             which is why b alone cannot pin the flip)
          c  align-self: center -> symmetric, 267    (also same either way)
          d  default -> line 1's bottom = 170 + (90 - 90) = 170
          e  align-self: flex-start -> line 1's BOTTOM = 170 + (90 - 25) = 235
             (array-reversal: 170)

        `a` and `e` are the two boxes that separate the models, and they do it
        on different lines and by different amounts (20 and 65).

     THE LINE'S TALLEST ITEM IS NOT THE ONE AT ITS FLIPPED START. `.b` is 40
     tall and sets line 0's cross size while sitting at the line's TOP; `.a` is
     20 tall at its bottom. A fixture whose tallest item also defined the edge
     being measured would agree with a half-implemented flip.

     Every y is distinct — 280, 260, 267, 170, 235 — so no two boxes can swap
     without the golden noticing.

     Breaks: three 80-wide items fit in 260 (240 <= 260), the fourth does not.
     Assignment is DOCUMENT order — `wrap-reverse` reverses the cross axis, not
     the order items are assigned to lines — so [a, b, c] is line 0 and it is
     line 0 that ends up at the bottom.

     `align-content: flex-start` is declared so the leftover 170 of the
     300-tall container stays unused and the stack's own edge is measurable;
     `flex_wrap_reverse_align_content_end` and `flex_wrap_reverse_row_reverse`
     take the other two interesting values.

     Sibling swap: `flex-wrap: wrap-reverse` -> `wrap` moves all five —
     a 280->0, b 260->0, c 267->7, d 170->40, e 235->40 — and collapses a/b to
     the same number, which is the signature of the un-flipped model. */
  #root { display: flex; flex-direction: row; flex-wrap: wrap-reverse;
          align-content: flex-start;
          width: 260px; height: 300px; }
  .a { width: 80px; height: 20px; }
  .b { width: 80px; height: 40px; align-self: flex-end; }   /* sets line 0's 40 */
  .c { width: 80px; height: 26px; align-self: center; }
  .d { width: 80px; height: 90px; }                         /* sets line 1's 90 */
  .e { width: 80px; height: 25px; align-self: flex-start; }
</style></head><body>
  <div id="root" data-id="root">
    <div class="a" data-id="a"></div>
    <div class="b" data-id="b"></div>
    <div class="c" data-id="c"></div>
    <div class="d" data-id="d"></div>
    <div class="e" data-id="e"></div>
  </div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* Three children with distinct heights (20/60/40), none equal to the
     100px line, so align-items: center moves each item's y by a different
     amount ((100-20)/2=40, (100-60)/2=20, (100-40)/2=30). Uniform heights
     would make every align-items value produce identical output. */
  #root { display: flex; flex-direction: row; align-items: center;
          width: 400px; height: 100px; }
  .a { width: 40px; height: 20px; }
  .b { width: 70px; height: 60px; }
  .c { width: 50px; height: 40px; }
</style></head><body>
  <div id="root" data-id="root">
    <div class="a" data-id="a"></div>
    <div class="b" data-id="b"></div>
    <div class="c" data-id="c"></div>
  </div>
</body></html>

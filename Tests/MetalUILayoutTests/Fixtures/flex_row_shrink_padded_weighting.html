<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* CSS Flexbox §9.7.4.c — the scaled flex shrink factor is `flex-shrink`
     times the item's INNER flex base size, not its border-box one.

     Both items declare 200 and overflow a 200-wide row by 200. `.a` carries
     80 of horizontal padding, so its inner base is 120 and `.b`'s is 200:
       inner weighting      -> a loses 200*120/320 = 75  -> 125, b -> 75
       border-box weighting -> a loses 200*200/400 = 100 -> 100, b -> 100
     `flex-shrink` is left at its initial 1 and `min-width` at its initial
     `auto`: this is the ordinary shape — a row of padded boxes that
     overflows — not a contrived one. `.a`'s automatic minimum is its own 80
     of padding, below both answers, so the floor never binds and cannot hide
     the weighting.

     Padding rather than border on purpose: a `border-width` without
     `border-style: solid` is inert (see `sizing_over_constrained_grows`), and
     padding alone is enough to separate the two readings. */
  #root { display: flex; flex-direction: row; width: 200px; height: 40px; }
  .a { width: 200px; padding: 0 40px; }
  .b { width: 200px; }
</style></head><body>
  <div id="root" data-id="root">
    <div class="a" data-id="a"></div>
    <div class="b" data-id="b"></div>
  </div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* The one ordinary-CSS shape that drives a §9.7.4 target main size NEGATIVE,
     which is what `max(0, ...)` in `ResolveFlexibleLengths.swift` exists for.
     Deleting that `max(0,` left 113/113 green before this fixture existed: no
     other fixture overflows hard enough, or with a lopsided enough shrink
     ratio, to push a raw target below zero.

     200px of content in a 50px row is -150 of free space. Shrink is weighted by
     base size (§9.7.4.c), so the weighted factors are 10*100 = 1000 and
     1*100 = 100, total 1100.
       pass 1: a = 100 - 150*(1000/1100) = -36.36  -> clamped to 0, frozen
               b = 100 - 150*( 100/1100) =  86.36
       pass 2: remaining = 50 - 0 - 100 = -50, b takes all of it -> 50
     giving a = 0, b = 50 with b's origin at 0.

     Without the clamp, `a` freezes at nothing: its violation is 0, so is b's,
     the total violation is 0 and the loop freezes the whole line on pass 1 at
     a = -36.36 and b = 86.36. That stores a negative-width rect AND drags b's
     origin to -36, which is why the origin comparison catches it too.

     Differential check: dropping `a`'s `flex-shrink: 10` (leaving the CSS
     default of 1) makes the factors equal, the overflow splits evenly, and the
     row lays out 25 / 25 instead of 0 / 50. The declaration is load-bearing. */
  #root { display: flex; flex-direction: row; width: 50px; height: 40px; }
  .a { flex: 0 10 100px; }
  .b { flex: 0 1 100px; }
</style></head><body>
  <div id="root" data-id="root">
    <div class="a" data-id="a"></div>
    <div class="b" data-id="b"></div>
  </div>
</body></html>

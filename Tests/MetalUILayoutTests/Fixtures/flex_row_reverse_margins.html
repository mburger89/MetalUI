<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* fix-round-1 bug 1: `row-reverse` applied `margin-left` to the item's
     PHYSICAL right instead of its physical left, because the engine added a
     physical `marginMain.leading` to a still-flex-relative cursor before
     converting to a physical coordinate. Three children, different widths,
     asymmetric margins on BOTH axes, so a left/right transposition on the
     reversed main axis cannot hide behind a symmetric value. */
  #root { display: flex; flex-direction: row-reverse; width: 400px; height: 100px; }
  .a { width: 50px; height: 30px; margin: 5px 30px 15px 10px; }
  .b { width: 60px; height: 40px; margin: 2px 4px 8px 20px; }
  .c { width: 40px; height: 20px; margin: 12px 18px 1px 6px; }
</style></head><body>
  <div id="root" data-id="root">
    <div class="a" data-id="a"></div>
    <div class="b" data-id="b"></div>
    <div class="c" data-id="c"></div>
  </div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* A stretched stack child still obeys its own `max-*` — CSS Box Alignment's
     `stretch` fills the cell "while still respecting the min/max constraints".
     Same 300x200 stretch root as `stack_stretch.html`; every child is auto-sized
     on both axes, so every axis takes the stretch branch, and only a max below
     the cell differs.

     `.h` caps the block axis (300x50), `.w` the inline axis (40x200), and `.p`
     caps both by PERCENTAGE — 20% of the cell's width, 10% of its height, so
     60x20. Against the other axis's basis it would be 40x30: that is the
     axis-swap `.p` exists to catch.

     No max exceeds the cell, so the grid's single auto track stays 300x200 and
     the three children are independent. A `min-*` above the cell would grow
     that track and move its siblings in the grid, which a stack has no track to
     do — `stack_stretch_min.html` holds that case alone for that reason. */
  #root { display: grid; justify-items: stretch; align-items: stretch;
          width: 300px; height: 200px; }
  #root > div { grid-area: 1 / 1; }
  .h { max-height: 50px; }
  .w { max-width: 40px; }
  .p { max-width: 20%; max-height: 10%; }
</style></head><body>
  <div id="root" data-id="root">
    <div class="h" data-id="h"></div>
    <div class="w" data-id="w"></div>
    <div class="p" data-id="p"></div>
  </div>
</body></html>

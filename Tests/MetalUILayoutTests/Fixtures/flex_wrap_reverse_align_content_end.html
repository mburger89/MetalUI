<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* `wrap-reverse` x `align-content: flex-end` — the pair where both features
     write the same axis, and the ONLY shape of it that can distinguish
     flipping the cursor from reversing the lines array.

     WHY flex-end AND NOT space-between. Reversing the array without flipping
     the leading offset is numerically identical to the correct answer for
     every SYMMETRIC distribution — `center`, `space-around`, `space-evenly`
     and `space-between` all put equal space at both ends, so the stack reads
     the same upside down. Only `flex-start` and `flex-end` put different
     amounts before and after the lines, and they are therefore the only two
     values that can redden under that mutation. (`positionItems`' main-axis
     comment records the same discriminator for `row-reverse`: it is
     `leading == trailing`, not `leading == 0`.)

     Under `wrap-reverse`, `flex-end` means the flipped cross-end — the
     container's TOP:

       cross used   = 40 + 90 + 12 (row-gap) = 142
       leftover     = 300 - 142 = 158, all of it BELOW the stack
       line 0 (40)  flex-relative 158       -> physical 300 - 158 - 40 = 102
       line 1 (90)  flex-relative 210       -> physical 300 - 210 - 90 =   0

       a 0,102   b 120,112   c 0,0

     `c` closes on the container's top edge at 0 and the 12px row-gap shows up
     as 102 - 90. `a` and `b` share line 0 and still differ (102 vs 112),
     because each is pinned to its own bottom edge inside a 40-tall line — the
     per-item half of the flip, which no forward-wrapping fixture can exhibit.

     Reversing the array without flipping the leading offset gives c 170,
     a 260, b 260 — three boxes wrong, two of them by 158.

     ROW-GAP IS DECLARED (12) AND COLUMN-GAP IS 0. The leftover cross space
     must be computed AFTER subtracting the gaps between lines — they are space
     the container has already spent, not space `align-content` may spend again
     — and with `flex-end` a double-counted gap moves the whole stack by 12.

     Sibling swap: `align-content: flex-end` -> `flex-start` moves a 102->260,
     b 112->270 and c 0->158 — the stack jumps to the other end of the
     container, which is what "flipped" means for this property. */
  #root { display: flex; flex-direction: row; flex-wrap: wrap-reverse;
          align-content: flex-end; gap: 12px 0;
          width: 260px; height: 300px; }
  .a { width: 120px; height: 40px; }
  .b { width: 120px; height: 30px; }
  .c { width: 120px; height: 90px; }
</style></head><body>
  <div id="root" data-id="root">
    <div class="a" data-id="a"></div>
    <div class="b" data-id="b"></div>
    <div class="c" data-id="c"></div>
  </div>
</body></html>

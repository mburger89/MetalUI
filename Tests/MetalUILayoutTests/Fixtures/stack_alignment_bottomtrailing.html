<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* Same root and child as stack_alignment_center.html -- only the alignment
     differs, so this is a differential rather than an unrelated number.
     `justify-items`/`align-items` are stated explicitly because grid defaults
     both to stretch and this framework's Stack does not (spec §2). */
  #root { display: grid; justify-items: end; align-items: end;
          width: 300px; height: 200px; }
  #root > div { grid-area: 1 / 1; }
  .child { width: 20px; height: 10px; }
</style></head><body>
  <div id="root" data-id="root">
    <div class="child" data-id="child"></div>
  </div>
</body></html>

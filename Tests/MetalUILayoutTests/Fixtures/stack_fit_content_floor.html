<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* fit-content's `max(min-content, available)` floor, in a stack. The stack
     is 30 wide and its child is a wrapping flex row of two 50x20 items
     (min-content 50, max-content 100), so min-content EXCEEDS the available
     space and the floor wins: 50 wide, one item per line, 40 tall. An engine
     that offers the child the stack's bare width gives 30; one that measures
     it at max-content gives 100x20. The stack's height is declared, so only
     the child's numbers carry the assertion.

     `justify-items: start` rather than the `center` a Stack defaults to, and
     that is the grid analogue's limit, not a choice about stacks: in the
     overflow regime a grid's single auto track grows to the child's
     min-content (50), past the container's 30, and a centred item is centred
     in that TRACK. A stack has no track and centres in its own content box.
     At the start edge the two agree. */
  #root { display: grid; justify-items: start; align-items: start;
          width: 30px; height: 100px; }
  #root > div { grid-area: 1 / 1; }
  .wrapper { display: flex; flex-wrap: wrap; }
  .k { width: 50px; height: 20px; }
</style></head><body>
  <div id="root" data-id="root">
    <div class="wrapper" data-id="f">
      <div class="k" data-id="f1"></div><div class="k" data-id="f2"></div>
    </div>
  </div>
</body></html>

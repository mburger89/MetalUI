<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* NON-SQUARE containing block — 200 wide, 100 tall. On a square containing
     block `top: 10%` and `left: 10%` would give the same number and a
     width-only implementation would pass; here they differ: 20 vs 10. */
  #root { position: relative; width: 200px; height: 100px; }
  .abs { position: absolute; top: 10%; left: 10%; width: 20px; height: 10px; }
</style></head><body>
  <div id="root" data-id="root">
    <div class="abs" data-id="abs"></div>
  </div>
</body></html>

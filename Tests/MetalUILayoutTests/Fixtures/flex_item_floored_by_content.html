<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* CSS Sizing §4.5's automatic minimum, for a CONTAINER item — the change
     with the widest blast radius in this milestone, because `min-width: auto`
     is CSS's default on every flex item and was floorless for a container
     until now. The content suggestion came from `tree.measure(kid)`, which is
     `nil` for anything without a `MeasureFunction`, so a container shrank
     straight through its own children.

     `.squeezed` and `.other` are `flex: 1 1 0`, so both start from a base size
     of 0 and split the root's 100 evenly: 50 / 50 is the unfloored answer, and
     it is the reason this fixture is needed rather than obvious. 50 / 50 is
     PLAUSIBLE. Only the floor makes WebKit say 80 / 20, and only a fixture
     says which of the two this engine produces.

     `.other` IS AN EMPTY DIV, and it must NOT be floored. §4.5's minimum is
     `min(specified suggestion, content suggestion)` and an empty div's content
     suggestion is 0, so it shrinks to 20 while its sibling stops at 80. That
     asymmetry is what keeps the rule honest here: a "floor every item at its
     hypothetical main size" bug, or ruling FS-3's missing specified-size
     suggestion implemented on its own, would freeze `.other` too and this
     fixture would notice.

     THE TWO ITEMS ARE NOT INTERCHANGEABLE and the fixture is not symmetric:
     `.squeezed` is a container, `.other` is a leaf, and the answers are 80 and
     20. Swapping which one holds the child moves both numbers, so the file
     cannot pass against an engine that floors the wrong sibling.

     `aContainerItemIsFlooredByItsChildrensWidth` in FlexEngineTests carries
     the DIFFERENTIAL — the same tree with `min-width: 0`, which is the only
     way to see the floor as a floor rather than as an arithmetic coincidence.
     A fixture cannot hold both halves, because a golden is one layout.

     Geometry: 100 / 60 / 80 / 20 are integers and 80 + 20 closes the root
     exactly, so no edge lands on WebKit's 1/64 grid. */
  #root { display: flex; width: 100px; height: 60px; }
  .squeezed { display: flex; flex: 1 1 0; }
  .squeezed > div { width: 80px; height: 20px; }
  .other { flex: 1 1 0; }
</style></head><body>
  <div id="root" data-id="root">
    <div class="squeezed" data-id="squeezed"><div data-id="g1"></div></div>
    <div class="other" data-id="other"></div>
  </div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* A stretched stack child still obeys its own `min-*` — the other half of
     `stack_stretch_max.html`. The child is auto-sized and stretched on both
     axes into a 300x200 cell, with a min above the cell on each: 340x260, not
     300x200. The two mins differ so a clamp that reads the other axis's bound
     gives a different, wrong box (300x340).

     ALONE in its cell, and that is the grid analogue's limit rather than a
     statement about stacks: a min above the container grows the grid's auto
     track to 340x260, and any sibling would then be stretched into that grown
     track. A stack has no track; its siblings stretch into its own 300x200
     content box. With one child the two agree. */
  #root { display: grid; justify-items: stretch; align-items: stretch;
          width: 300px; height: 200px; }
  #root > div { grid-area: 1 / 1; }
  .m { min-width: 340px; min-height: 260px; }
</style></head><body>
  <div id="root" data-id="root">
    <div class="m" data-id="m"></div>
  </div>
</body></html>

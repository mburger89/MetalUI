<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* Ruling BM-5, composition 1 of 2: stretch + `min-height` + cross margins.
     Task 2 shipped two real bugs, both living in exactly this shape — two
     features that each work alone and were never composed in the corpus. The
     engine is believed correct here; this fixture is what turns "believed"
     into "measured", and it is the counterpart to
     `flex_row_stretch_with_margins`, which pins the same ordering against
     `max-height` instead.

     `min`/`max-height` describe the BORDER box, so margins come off the line
     first and the clamp applies to what is left:

       .a  available 100 - 20 - 30 = 50, floored by min-height 70 -> 70 at y=20
           (the floor BINDS, and the item deliberately overflows the container:
           20 + 70 + 30 = 120 > 100, which is what CSS does)
       .b  available 100 - 10 - 15 = 75, floor 40 does not bind -> 75 at y=10

     Both children are needed: `.a` alone cannot distinguish "the floor is
     applied" from "the floor replaces the stretched size unconditionally", and
     `.b` alone never exercises the floor at all. Asymmetric top/bottom margins
     on both, so a transposed cross edge cannot hide. */
  #root { display: flex; flex-direction: row; width: 400px; height: 100px; }
  .a { width: 50px; margin: 20px 0 30px 0; min-height: 70px; }
  .b { width: 60px; margin: 10px 0 15px 0; min-height: 40px; }
</style></head><body>
  <div id="root" data-id="root">
    <div class="a" data-id="a"></div>
    <div class="b" data-id="b"></div>
  </div>
</body></html>

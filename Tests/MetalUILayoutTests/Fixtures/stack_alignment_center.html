<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* A stack: one grid cell, every child in it. `justify-items`/`align-items`
     are stated explicitly because grid defaults both to stretch and this
     framework's Stack centres instead (SwiftUI's answer, spec §2) -- an
     omitted pair here would measure stretch and read as an engine bug. */
  #root { display: grid; justify-items: center; align-items: center;
          width: 300px; height: 200px; }
  #root > div { grid-area: 1 / 1; }
  .child { width: 20px; height: 10px; }
</style></head><body>
  <div id="root" data-id="root">
    <div class="child" data-id="child"></div>
  </div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  #root { display: flex; flex-direction: row; width: 300px; height: 40px; }
  /* Deliberately UNEQUAL bases, so the floor actually binds. Both shrink by
     factor 1, weighted by base size: of the 300px overflow `a` would give up
     300 * 200/600 = 100 and land on 100. `min-width: 150px` stops it, so it
     freezes at 150 and `b` absorbs the whole remainder, 400 - 250 = 150.

     Equal bases would make this fixture inert: 250/250 in a 300px row shrink
     to 150/150, a `min-width: 120px` never binds, and deleting the declaration
     changes nothing. Check any replacement the same way — the fixture must
     produce different geometry with the `min-width` line removed. */
  .a { flex: 0 1 200px; min-width: 150px; }
  .b { flex: 0 1 400px; }
</style></head><body>
  <div id="root" data-id="root">
    <div class="a" data-id="a"></div>
    <div class="b" data-id="b"></div>
  </div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* Three children, each with different asymmetric margins on BOTH axes, in a
     `space-between` container so a mis-measured line content size (margins
     dropped from `lineContentSize`) moves every item, not just the edges.
     Class selectors (specificity 0,1,0) beat the `*` reset's margin: 0
     (0,0,0), same pattern as `flex_row_padding_border`. */
  #root { display: flex; flex-direction: row; justify-content: space-between;
          width: 400px; height: 100px; }
  .a { width: 40px; height: 30px; margin: 5px 10px 15px 20px; }
  .b { width: 50px; height: 40px; margin: 2px 25px 8px 3px; }
  .c { width: 60px; height: 20px; margin: 12px 4px 1px 18px; }
</style></head><body>
  <div id="root" data-id="root">
    <div class="a" data-id="a"></div>
    <div class="b" data-id="b"></div>
    <div class="c" data-id="c"></div>
  </div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; }
  /* Task 4's flagged, oracle-unverified generalisation: ONE inset given on an
     axis (`left`), no opposite inset, and no declared size — so the size on
     that axis can only come from content. `top` is pinned explicitly so the
     VERTICAL axis stays outside this fixture's question: leaving it all-auto
     too would additionally exercise the deliberate static-position divergence
     (spec §7.1), which is measured and pinned separately and must not be
     encoded into a fixture. */
  #root { position: relative; width: 200px; height: 100px; }
  .abs { position: absolute; top: 10px; left: 20px; }
  .content { width: 35px; height: 15px; }
</style></head><body>
  <div id="root" data-id="root">
    <div class="abs" data-id="abs"><div class="content" data-id="content"></div></div>
  </div>
</body></html>

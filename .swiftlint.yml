# SwiftLint configuration (see docs/practices/linting.md for the per-rule table and the reasons).
# Philosophy: surface real bug classes early, stay silent on the house style.
# Existing violations are frozen in .swiftlint-baseline.json; CI reports only new ones.

included:
  - Sources
  - Tests
  - Backends/SDL/Sources
  - Backends/SDL/Tests
  - Examples

excluded:
  - .build
  - "**/.build"
  - Sources/MetalUIIconData   # vendored Lucide icon geometry (generated by scripts/vendor-lucide.py)
  - docs/probes               # standalone SwiftUI probe scripts, not part of the package
  # Vendored C (CFreeType, CHarfBuzz, CSheenBidi, CUnibreak, CStbImage) contains no Swift;
  # SDL3 and AccessKit are not in the tree (THIRD-PARTY-NOTICES.md).

# Opt-in rules that flag a real bug class (counts were measured and are sane).
opt_in_rules:
  - force_unwrapping
  - identical_operands
  - unowned_variable_capture
  - overridden_super_call
  - prohibited_super_call
  - weak_delegate
  - discarded_notification_center_observer
  - contains_over_first_not_nil
  - first_where
  - empty_count
  - yoda_condition
  - implicitly_unwrapped_optional
  - unhandled_throwing_task
  - class_delegate_protocol
  - lower_acl_than_parent
  - contains_over_filter_is_empty
  - legacy_multiple
  - empty_string
  - empty_collection_literal

# Rules that stay off. The rest of the default rule set is on; a rule is fixed in code or tuned
# with options below before it is disabled (docs/practices/linting.md has the full table).
disabled_rules:
  - discouraged_optional_collection  # `[T]?` is API here: nil (not asked / unknown) differs from [] (asked, none)
  - discouraged_optional_boolean     # `Bool?` is a deliberate tri-state (unset / yes / no), as SwiftUI's own
  - multiple_closures_with_trailing_closure  # SwiftUI's own call shapes: `Button(action: { }) { label }`, `onGeometryChange(for:of:) { }`
  - statement_position               # compact `if { } ⏎ else if { }` chains with `else` aligned under `if`; no option accepts both styles
  - redundant_nil_coalescing         # every site flattens `T??` (`last ?? nil`, `map { optional } ?? nil`), which the rule cannot see
  - optional_data_string_conversion  # most sites decode [UInt8]/ArraySlice (no String(data:)); lossy U+FFFD is the intent

# Metric rules: thresholds sit near the tail of today's tree (p99.9) so they catch outliers, not the norm.
line_length:
  warning: 250
  error: 400
  ignores_comments: true
  ignores_urls: true
file_length:
  warning: 2000
  error: 6000
type_body_length:
  warning: 1000
  error: 2500
function_body_length:
  warning: 200
  error: 500
cyclomatic_complexity:
  warning: 40
  error: 80
function_parameter_count:
  warning: 12
  error: 20
large_tuple:
  warning: 7
  error: 12
nesting:
  type_level:
    warning: 3

# Names: single-letter math/layout names are the house style; `_x` is the SwiftUI-mirroring
# "implementation detail" spelling; sentence-style test names stay under the default 40/60 limit.
identifier_name:
  min_length: 1
  allowed_symbols: ["_"]
  excluded: [A, B, C, E, H, K, L, N, W]  # capital single letters: Lab/colour channels, width/height, test fixtures
type_name:
  min_length: 1
  allowed_symbols: ["_"]

# `master` is the repository's default branch (there is no `main`) and the pty master end.
inclusive_language:
  override_allowed_terms: ["master"]

# A whole `switch` on one line is a compact table, not a misaligned one.
switch_case_alignment:
  ignore_one_liners: true

# Aligned columns (`key:   value`) are the house style for dictionaries and arguments.
colon:
  apply_to_dictionaries: false
  flexible_right_spacing: true
